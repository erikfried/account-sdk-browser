extends: eslint:recommended
parserOptions:
  ecmaVersion: 2017
  sourceType: module
plugins:
  - import
env:
    commonjs: true
    browser: true
    mocha: true
    es6: true
rules:
    import/extensions:
      - error
      - always
    no-undefined: error
    no-var: error
    indent:
      - warn
      - 4
    no-unused-vars: error
    require-jsdoc:
      - warn
      - require:
          FunctionDeclaration: true
          ClassDeclaration: true
          MethodDefinition: true
          ArrowFunctionExpression: false
          FunctionExpression: true
    valid-jsdoc:
      - warn
      - requireParamDescription: false
        requireReturnDescription: false
overrides:
  - files: "*.ts"
    parser: "@typescript-eslint/parser"
    parserOptions:
      ecmaVersion: 2017
      sourceType: module
      project: "./tsconfig.json"
    plugins:
      - "@typescript-eslint"
      - import
    extends:
      - eslint:recommended
      - plugin:@typescript-eslint/recommended
    rules:
      import/extensions:
        - error
        - never
      "@typescript-eslint/no-explicit-any": off
      "@typescript-eslint/no-unused-vars": error
      no-unused-vars: off
      require-jsdoc: off
      valid-jsdoc: off
